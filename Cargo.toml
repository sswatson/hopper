[package]
name = "hopper"
version = "0.1.0"
edition = "2024"
authors = ["Sam Watson"]
description = "A fast TUI for browsing S3 buckets"
license = "MIT"
readme = "README.md"

[dependencies]
# TUI framework
ratatui = "0.30"
crossterm = "0.29"

# Async runtime
tokio = { version = "1.49", features = ["full"] }

# AWS
aws-config = { version = "1.12", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.152"

# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "1.0.3"
# Format-preserving edits when adding/removing buckets from the config file
toml_edit = "0.25"

# Error handling
anyhow = "1.0"

# CLI args
clap = { version = "4.5", features = ["derive"] }

# Clipboard
arboard = "3.6"

# Date/time
chrono = "0.4"

# Config file location
dirs = "6.0"

# Display-width measurement for terminal cells (CJK/emoji are 2 columns wide)
unicode-width = "0.2"

# The binary is distributed by copying it around; keep it small and fast.
[profile.release]
strip = true
lto = "thin"
